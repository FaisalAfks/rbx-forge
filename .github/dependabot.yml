# Keeps GitHub Actions and Rust crates up to date: one grouped PR a week for each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: ["type: chore", "skip-notes"]
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    labels: ["type: chore", "skip-notes"]
    groups:
      crates: { patterns: ["*"] }
