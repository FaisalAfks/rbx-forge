# A tag vX.Y.Z on main builds forge for Windows and makes the GitHub release with it attached, with notes generated
# from the PR labels. forge.exe carries its Studio plugin inside (`forge plugin install` writes it out).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p forge
      - name: Release
        shell: bash
        run: |
          cp target/release/forge.exe forge.exe
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            --verify-tag ${{ contains(github.ref_name, '-') && '--prerelease' || '' }} forge.exe
        env:
          GH_TOKEN: ${{ github.token }}
