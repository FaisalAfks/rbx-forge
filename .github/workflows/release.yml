# A tag vX.Y.Z on main makes the GitHub release, with notes generated from the PR labels.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - run: gh release create ${{ github.ref_name }} -R ${{ github.repository }} --title "${{ github.ref_name }}" --generate-notes --verify-tag ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
