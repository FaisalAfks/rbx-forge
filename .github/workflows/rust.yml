# Format, lint and tests for the Rust code, on Windows (where forge is used) and Linux. rust-toolchain.toml picks the
# compiler, so CI and local builds match. It runs when Rust code, a tool's folder (forge packs each tool's studio/ into
# its plugin) or the build changes, so a docs-only change doesn't wait on it (decision 0019).
name: Rust

on:
  pull_request:
    paths:
      - "core/**"
      - "forge/**"
      - "mcp/**"
      - "plugin/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "forge/**"
      - "mcp/**"
      - "plugin/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # The link tests start servers; one that hangs fails the job here, not after GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
