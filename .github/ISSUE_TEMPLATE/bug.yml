name: Bug
description: Something doesn't work as it should
labels: ["type: bug"]
projects: ["FaisalAfks/2"]
body:
  - type: dropdown
    id: tool
    attributes: { label: Tool, options: ["sync", "repo"] }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, description: "What the tool did, with its output or a screenshot if there is any." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What should happen }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, description: "The smallest place, command or steps that show it." }
  - type: input
    id: versions
    attributes: { label: Versions, description: "forge version, Studio version, Windows version (e.g. 0.1.0, 0.700, Windows 11)" }
    validations: { required: true }
