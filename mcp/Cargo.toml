[package]
name = "forge-mcp"
description = "forge's MCP server: each tool runs a forge command and returns what it printed"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["process", "io-util"] }

[lints]
workspace = true
