[package]
name = "forge"
description = "Roblox tooling: a whole game in git as readable files, with a CLI and an MCP for every tool"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
forge-core = { path = "../core" }
forge-mcp = { path = "../mcp" }
forge-sync = { path = "../tools/sync" }
rbx_dom_weak = "4.2.0"
rbx_xml = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tungstenite = "0.30.0"

[lints]
workspace = true
