[package]
name = "forge-core"
description = "What every forge tool uses: the link to Studio, settings, a game's forge.toml, and the Tool interface"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = "4.6.7"
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30.0"
toml = "1.2.1"

[lints]
workspace = true
