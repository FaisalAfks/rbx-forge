# The Rust workspace (decision 0019): core/ is what every tool uses, tools/<name>/ is each tool, forge/ is the binary
# that lists them, and mcp/ serves their MCP tools.
[workspace]
members = ["core", "forge", "mcp", "tools/sync"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
repository = "https://github.com/FaisalAfks/rbx-forge"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
